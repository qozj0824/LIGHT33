services:
  - type: web
    name: lightt
    runtime: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: python -m uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: LIGHTT_ANALYSIS_CONCURRENCY
        value: "1"
      - key: LIGHTT_MAX_UPLOAD_BYTES
        value: "314572800"
      - key: LIGHTT_MAX_REQUEST_BYTES
        value: "629145600"
      - key: LIGHTT_MAX_IMAGE_PIXELS
        value: "120000000"
