[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "results", "uploads"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
exclude = "(.venv|results|uploads)"

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "astropy", "astropy.*"]
ignore_missing_imports = true
